site_name: GEOGLOWS Training
# Version 2 archive: built and reachable at /v2/ but intentionally kept out of the sidebar.
not_in_nav: |
  /v2/**
# Pages not currently used on the site: kept in the repo but not built or published.
exclude_docs: |
  /unused/
  /rfs/improving-results/
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
  - macros
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
