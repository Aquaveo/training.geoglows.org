theme:
  features:
    - content.code.copy
    - content.code.select
    - navigation.path
    - navigation.footer
    - toc.follow
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
nav:
  - Home: index.md
  - RFS:
      - What's New?: rfs/whats-new.md
      - Model Formulation:
          - Overview: rfs/model-formulation/model-formulation.md
          - V3 Model Improvements: rfs/model-formulation/v3-improvements.md
          - Model Inputs: rfs/model-formulation/model-inputs.md
          - River Routing: rfs/model-formulation/river-routing.md
          - Flood Mapping: rfs/model-formulation/flood-mapping.md
      - Available Data:
          - Data Catalog: rfs/datasets/catalog.md
          - Hydrography: rfs/datasets/hydrography.md
          - Retrospective Data: rfs/datasets/retrospective.md
          - 15 Day Forecast Data: rfs/datasets/forecast.md
          - 45 Day Forecast Data: rfs/datasets/forecast-45day.md
          - Flood Maps: rfs/datasets/flood-maps.md
      - Accessing Data:
          - Code and APIs: rfs/accessing-data/code-and-apis.md
          - Bulk Downloads: rfs/accessing-data/bulk-download.md
          - Cookbook: rfs/accessing-data/code-snippets.md
          - Web Apps:
              - Hydroviewer: rfs/accessing-data/web-apps/hydroviewer.md
              - HydroSOS: rfs/accessing-data/web-apps/hydrosos.md
              - FEWS App: rfs/accessing-data/web-apps/fews-app.md
              - Flood Map App: rfs/accessing-data/web-apps/flood-map-app.md
      - Tutorials:
          - Finding River Numbers: rfs/tutorials/find-river-numbers.md
          - Calculating Streamflow Volume: rfs/tutorials/streamflow-volume.md
          - API (Data Service): rfs/tutorials/data-service.md
          - Web Maps (GIS Layers): rfs/tutorials/web-map.md
      - Bias Correction:
          - Bias Correction Method: rfs/bias-correction/bias-correction-method.md
          - Correcting Data: rfs/bias-correction/forecasted-bias-correction.md
          - SABER Method: rfs/bias-correction/bias-correction.md
  - Groundwater:
      - Scientific Background: groundwater/scientific-background.md
      - Aquifer Analyst: groundwater/aquifer-analyst.md
      - Groundwater Storage Trends – GRACE: groundwater/storage-trends-grace.md
  - Webinars:
      - "1. GEOGLOWS History and Introducing RFS Version 2": webinars/rfs-v2-webinar-1.md
      - "2. GEOGLOWS Model Formulation": webinars/rfs-v2-webinar-2.md
      - "3. GEOGLOWS Available Data": webinars/rfs-v2-webinar-3.md
      - "4. GEOGLOWS Hydroviewer 101": webinars/rfs-v2-webinar-4.md
  - Publications: rfs/publications.md
