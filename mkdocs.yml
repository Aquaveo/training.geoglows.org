theme:
  features:
    - content.code.copy
    - content.code.select
    - navigation.path
    - navigation.footer
    - toc.follow
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
nav:
  - Home: index.md
  - River Forecast System:
      - What's New?: rfs/whats-new.md
      - Part 1 What is it?:
          - Model Overview: rfs/what-is-it/model-overview.md
          - Available Data: rfs/what-is-it/available-data.md
          - Flood Maps: rfs/what-is-it/flood-maps.md
          - Using the Datastore: rfs/what-is-it/using-datastore.md
      - Part 2 Globally Available Web Applications:
          - Overview of Available Applications: rfs/web-apps/overview.md
          - Hydroviewer: rfs/web-apps/hydroviewer.md
          - FEWS: rfs/web-apps/fews-app.md
          - HydroSOS: rfs/web-apps/hydrosos.md
          - Flood Map App: rfs/web-apps/flood-map-app.md
      - Part 3 Tutorials:
          - Finding River Numbers: rfs/tutorials/find-river-numbers.md
          - Querying Data: rfs/tutorials/query-data.md
          - API (Data Service): rfs/tutorials/data-service.md
          - Web Maps (GIS Layers): rfs/tutorials/web-map.md
          - Calculating Streamflow Volume: rfs/tutorials/streamflow-volume.md
      - Part 4 Advanced Concepts:
          - Working with Data:
              - Data Catalog: rfs/advanced/working-with-data/catalog.md
              - Hydrography: rfs/advanced/working-with-data/hydrography.md
          - Accessing Data with Code:
              - Code and APIs: rfs/advanced/code/code-and-apis.md
              - Cookbook: rfs/advanced/code/code-snippets.md
              - Bulk Downloads: rfs/advanced/code/bulk-download.md
          - Model Formulation:
              - Overview: rfs/advanced/model-formulation/model-formulation.md
              - V3 Model Improvements: rfs/advanced/model-formulation/v3-improvements.md
              - Model Inputs: rfs/advanced/model-formulation/model-inputs.md
              - River Routing: rfs/advanced/model-formulation/river-routing.md
              - Flood Mapping: rfs/advanced/model-formulation/flood-mapping.md
          - Bias Correction:
              - SABER Method: rfs/advanced/bias-correction/saber-method.md
              - Bias Correction Method: rfs/advanced/bias-correction/bias-correction-method.md
              - Local Bias Correction: rfs/advanced/bias-correction/correcting-data.md
  - Groundwater:
      - Scientific Background: groundwater/scientific-background.md
      - Aquifer Analyst: groundwater/aquifer-analyst.md
      - Groundwater Storage Trends – GRACE: groundwater/storage-trends-grace.md
  - Webinars:
      - "1. GEOGLOWS History and Introducing RFS Version 2": webinars/rfs-v2-webinar-1.md
      - "2. GEOGLOWS Model Formulation": webinars/rfs-v2-webinar-2.md
      - "3. GEOGLOWS Available Data": webinars/rfs-v2-webinar-3.md
      - "4. GEOGLOWS Hydroviewer 101": webinars/rfs-v2-webinar-4.md
