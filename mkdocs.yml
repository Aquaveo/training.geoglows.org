theme:
  name: readthedocs
  custom_dir: overrides
  navigation_depth: 4
  logo: static/images/geoglows-logo.png
hooks:
  - hooks/i18n_root_templates.py
extra_css:
  - stylesheets/geoglows.css
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/mobile-nav.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
nav:
  - Home: index.md
  - River Forecast System:
      - What's New?: rfs/whats-new.md
      - Part 1 Background:
          - Model Overview: rfs/background/model-overview.md
          - What to Find on This Site: rfs/background/site-guide.md
      - Part 2 Model Formulation:
          - Overview: rfs/model-formulation/model-formulation.md
          - Model Inputs: rfs/model-formulation/model-inputs.md
          - River Routing: rfs/model-formulation/river-routing.md
          - Flood Mapping: rfs/model-formulation/flood-mapping.md
      - Part 3 Data:
          - Available Data: rfs/data/available-data.md
          - Accessing Data:
              - The Datastore: rfs/data/accessing-data/datastore.md
              - Advanced Accessing Methods: rfs/data/accessing-data/advanced-methods.md
              - Accessing Flood Maps: rfs/data/accessing-data/flood-maps.md
      - Part 4 Globally Available Web Applications:
          - Overview of Available Applications: rfs/web-apps/overview.md
          - Hydroviewer: rfs/web-apps/hydroviewer.md
      - Part 5 Tutorials:
          - Finding River Numbers: rfs/tutorials/find-river-numbers.md
          - Web Maps (GIS Layers): rfs/tutorials/web-map.md
          - Calculating Streamflow Volume: rfs/tutorials/streamflow-volume.md
      # Hidden for now: Part 6 Improving Model Results (also excluded under exclude_docs above)
      # - Part 6 Improving Model Results:
      #     - Contributing Data: rfs/improving-results/contributing-data.md
      - Webinars:
          - "1. GEOGLOWS History and Introducing RFS Version 2": rfs/webinars/rfs-v2-webinar-1.md
          - "2. RFS Model Formulation": rfs/webinars/rfs-v2-webinar-2.md
          - "3. RFS Available Data": rfs/webinars/rfs-v2-webinar-3.md
          - "4. RFS Hydroviewer 101": rfs/webinars/rfs-v2-webinar-4.md
      - Publications: publications.md
  - GRACE Regional Analyst:
      - Part 1 Background:
          - Overview: grace/background/overview.md
          - The GRACE Mission: grace/background/grace-mission.md
          - Deriving Groundwater Storage: grace/background/deriving-groundwater.md
          - Resolution, Leakage and Small Regions: grace/background/resolution-and-leakage.md
      - Part 2 Using the App:
          - Interface: grace/app/interface.md
          - Regional View: grace/app/regional-view.md
          - Global View: grace/app/global-view.md
          - Trend Analysis: grace/app/trends.md
          - Downloading Data: grace/app/downloading-data.md
      - Part 3 Gap Filling:
          - Gaps in the Record: grace/gap-filling/gaps.md
          - The Seasonal Model: grace/gap-filling/seasonal-model.md
      - Part 4 Recharge Analysis:
          - The WTF Method: grace/recharge/wtf-method.md
          - Opening the Analysis: grace/recharge/opening.md
          - Water Years and Picks: grace/recharge/picks.md
          - Results: grace/recharge/results.md
      - Part 5 Case Studies:
          - Niger: grace/case-studies/niger.md
          - Volta Basin: grace/case-studies/volta.md
          - California's Central Valley: grace/case-studies/central-valley.md
      - Publications: grace/publications.md
